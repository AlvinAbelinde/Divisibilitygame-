<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divisibility Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#1f4068,#0f2027);
  font-family:'Poppins',sans-serif;
  color:white;
  text-align:center;
}

.screen{display:none;padding:20px;animation:fade .4s ease}
.active{display:block}

@keyframes fade{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

button{
  background:linear-gradient(135deg,#273c75,#192a56);
  color:white;
  border:none;
  padding:14px;
  margin:6px;
  font-size:16px;
  border-radius:14px;
  width:90%;
  max-width:360px;
  font-weight:600;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}

button:active{transform:scale(.95)}

#buttons{text-align:center}
#buttons button{
  width:64px;
  border-radius:10px;
  margin:5px;
  font-weight:700;
}

.selected{background:#f1c40f;color:#000}
.correct{background:#2ecc71!important;color:#000}
.wrong{background:#e74c3c!important;color:#000}

.box{
  background:rgba(0,0,0,.35);
  border-radius:16px;
  padding:14px;
  margin:14px 0;
}

#numberDisplay{
  font-size:34px;
  font-weight:800;
  margin:18px 0;
  word-break:break-all;
}

.home-btn{
  position:fixed;
  top:12px;
  left:12px;
  width:44px;
  height:44px;
  border-radius:50%;
  font-size:20px;
  background:linear-gradient(135deg,#16a085,#1abc9c);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.help-btn{
  position:fixed;
  top:12px;
  right:12px;
  width:44px;
  height:44px;
  border-radius:50%;
  font-size:20px;
  background:linear-gradient(135deg,#f39c12,#f1c40f);
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.help-btn-static{
  background:linear-gradient(135deg,#f39c12,#f1c40f);
  color:#000;
  font-weight:700;
}

.win{color:#2ecc71}
.lose{color:#e74c3c}
.difficulty-label{font-size:14px;opacity:.85}

.game-layout{
  display:flex;
  justify-content:center;
  gap:12px;
  align-items:flex-start;
}

.left-area{text-align:center}
.right-area{width:140px}

.small-btn{
  font-size:13px;
  padding:10px;
  width:100%;
}

.divisible-label{
  font-weight:700;
  margin:8px 0 6px;
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="winSound" src="win.mp3"></audio>
<audio id="loseSound" src="lose.mp3"></audio>

<!-- MAIN MENU -->
<div id="mainMenu" class="screen active">
  <h1>Divisibility Challenge</h1>
  <button onclick="show('title')">▶ Play</button>
  <button onclick="showHowTo()">❓ How to Play</button>
</div>

<!-- DIFFICULTY -->
<div id="title" class="screen">
<h1>Select Difficulty</h1>
<button class="help-btn-static" onclick="showHowTo()">❓ How to Play</button>

<button onclick="startGame('baby')">Baby 🏆 <span id="hs-baby">0</span></button>
<button onclick="startGame('james')">James Masarap 🏆 <span id="hs-james">0</span></button>
<button onclick="startGame('caluttong')">Caluttong Level 🏆 <span id="hs-caluttong">0</span></button>
<button onclick="startGame('sirjerry')">🔥 Sir Jerry Pampapawis 🏆 <span id="hs-sirjerry">0</span></button>
</div>

<!-- GAME -->
<div id="game" class="screen">
<button class="home-btn" onclick="goMain()">🏠</button>
<button class="help-btn" onclick="showHowTo()">❓</button>

<h3>⏱ Time: <span id="time"></span>s</h3>
<div class="difficulty-label">Difficulty: <span id="difficultyText"></span></div>

<div id="numberDisplay"></div>

<div class="game-layout">
  <div class="left-area">
    <div class="divisible-label">Divisible Numbers</div>
    <div id="buttons"></div>
  </div>

  <div class="right-area">
    <button class="small-btn" onclick="removeBigBrothers()">🧹 Remove Big Brothers</button>
    <button class="small-btn" onclick="useNone()">🚫 NONE</button>
    <button class="small-btn" onclick="finishEarly()">⏩ Skip the time</button>
  </div>
</div>

<div class="box">
<h3>📘 Divisibility Rules</h3>
<img src="rules.jpg" style="width:100%;max-width:420px;border-radius:12px">
</div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
<h1 id="resultText"></h1>

<div class="box">
🔥 Current Streak: <span id="currentStreakText">0</span><br>
🏆 Highest Streak: <span id="highStreakText">0</span>
</div>

<div class="box">
<b>Correct Answers</b>
<p id="correctList"></p>
</div>

<div class="box">
<b>Your Answers</b>
<p id="playerList"></p>
</div>

<button id="nextBtn" onclick="nextGame()">Next Game</button>
<button onclick="goMain()">Back to Menu</button>
</div>

<script>
let winSound=document.getElementById("winSound");
let loseSound=document.getElementById("loseSound");
let confettiInterval;

function stopSounds(){
  winSound.pause(); loseSound.pause();
  winSound.currentTime=0;
  loseSound.currentTime=0;
}

function startConfetti(){
  stopConfetti();
  confettiInterval=setInterval(()=>{
    const c=document.createElement("div");
    c.style.position="fixed";
    c.style.top="-10px";
    c.style.left=Math.random()*100+"vw";
    c.style.width="8px";
    c.style.height="8px";
    c.style.background=`hsl(${Math.random()*360},100%,50%)`;
    c.style.borderRadius="50%";
    c.style.zIndex="9999";
    c.style.transition="top 2s linear";
    document.body.appendChild(c);
    requestAnimationFrame(()=>c.style.top="110vh");
    setTimeout(()=>c.remove(),2000);
  },120);
}

function stopConfetti(){clearInterval(confettiInterval);}

let currentNumber, correctDivisors=[], selected=[], timer, timeLeft, mode="";
let currentStreak={}, highStreak={};

const data={
  baby:{digits:[3,5],time:60,name:"Baby"},
  james:{digits:[6,8],time:60,name:"James Masarap"},
  caluttong:{digits:[9,12],time:60,name:"Caluttong Level"},
  sirjerry:{digits:[20,30],time:60,name:"Sir Jerry Pampapawis"}
};

Object.keys(data).forEach(m=>{
  currentStreak[m]=0;
  highStreak[m]=Number(localStorage.getItem("high-"+m))||0;
});

function updateTitle(){
  for(let m in highStreak)
    document.getElementById("hs-"+m).innerText=highStreak[m];
}
updateTitle();

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function randomBig(min,max){
  let d=Math.floor(Math.random()*(max-min+1))+min,n="";
  for(let i=0;i<d;i++) n+=Math.floor(Math.random()*10);
  return n.replace(/^0/,'1');
}

function startGame(m){
  clearInterval(timer); stopSounds(); stopConfetti();
  mode=m; selected=[]; correctDivisors=[];
  let d=data[m];
  currentNumber=randomBig(d.digits[0],d.digits[1]);
  timeLeft=d.time;
  difficultyText.innerText=d.name;
  numberDisplay.innerText=currentNumber;
  createButtons(); startTimer(); show('game');
}

function createButtons(){
  buttons.innerHTML="";
  for(let i=2;i<=15;i++){
    if(BigInt(currentNumber)%BigInt(i)===0n) correctDivisors.push(i);
    let b=document.createElement("button");
    b.innerText=i;
    b.onclick=()=>{
      b.classList.toggle("selected");
      selected.includes(i)?selected=selected.filter(x=>x!==i):selected.push(i);
    };
    buttons.appendChild(b);
  }
}

function removeBigBrothers(){
  document.querySelectorAll("#buttons button").forEach(b=>{
    let n=+b.innerText;
    if(n>=11){
      b.disabled=true;
      b.className=correctDivisors.includes(n)?"correct":"wrong";
      if(correctDivisors.includes(n)&&!selected.includes(n))selected.push(n);
    }
  });
}

function startTimer(){
  time.innerText=timeLeft;
  timer=setInterval(()=>{
    time.innerText=--timeLeft;
    if(timeLeft<=0){clearInterval(timer);check();}
  },1000);
}

function finishEarly(){clearInterval(timer);check();}
function useNone(){clearInterval(timer);check(true);}

function check(usedNone=false){
  let win=usedNone?correctDivisors.length===0:
    correctDivisors.length===selected.length &&
    correctDivisors.every(x=>selected.includes(x));

  stopSounds(); stopConfetti();
  if(win){winSound.play();startConfetti();}
  else{loseSound.play();}

  resultText.innerText=win?"🎉 YOU WIN!":"❌ YOU LOSE";
  resultText.className=win?"win":"lose";

  currentStreak[mode]=win?currentStreak[mode]+1:0;
  if(currentStreak[mode]>highStreak[mode]){
    highStreak[mode]=currentStreak[mode];
    localStorage.setItem("high-"+mode,highStreak[mode]);
  }

  updateTitle();
  currentStreakText.innerText=currentStreak[mode];
  highStreakText.innerText=highStreak[mode];
  correctList.innerText=correctDivisors.join(", ")||"None";
  playerList.innerText=selected.join(", ")||"None";
  nextBtn.style.display=win?"block":"none";
  show('result');
}

function nextGame(){stopSounds();stopConfetti();startGame(mode)}
function goMain(){clearInterval(timer);stopSounds();stopConfetti();show('mainMenu')}

function showHowTo(){
  alert(`HOW TO PLAY
• A big number appears
• Select ALL divisors from 2–15
• One mistake = LOSE
• NONE if no divisors fit
• Remove Big Brothers auto-handles 11–15
• Be 100% correct to WIN`);
}
</script>

</body>
</html>
